name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=gwynerd&show_icons=true&hide_rank=true&bg_color=0d1117&title_color=2f80ed&text_color=c9d1d9&icon_color=8b949e&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Most Used Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=gwynerd&layout=compact&langs_count=10&bg_color=0d1117&title_color=2f80ed&text_color=c9d1d9&hide_border=false
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats" || exit 0
          git push